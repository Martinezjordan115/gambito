<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Gambito: prototipo de ajedrez con apuesta de fichas virtuales.">
<title>Gambito Ajedrez</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<style>
/* Layout: tablero protagonista a la izquierda, mesa de apuesta + reloj + jugadas a la derecha; en móvil se apila. */
:root{
  --bg:#eef0ec; --surface:#ffffff; --line:#d5d9d2; --fg:#1c211d; --muted:#5d665f;
  --accent:#c2410c; --accent-fg:#ffffff; --chip:#b8860b;
  --sq-light:#e6e2d3; --sq-dark:#5f7a6b; --sq-sel:#e7b54a; --sq-last:rgba(231,181,74,.45); --sq-check:#d94a3a;
  --pw:#fbfaf6; --pstroke:#20251f; --pb:#1d221e;
  --good:#2f7d4f; --bad:#b4372b;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"IBM Plex Sans", system-ui, -apple-system, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141815; --surface:#1d221f; --line:#2f3732; --fg:#e8ebe6; --muted:#9aa49d;
  --accent:#f0773b; --accent-fg:#1a0d05; --chip:#e0b44c;
  --sq-light:#c9c4b2; --sq-dark:#476153; --sq-sel:#d9a63a; --sq-last:rgba(217,166,58,.5); --sq-check:#d94a3a;
  --good:#5cbf86; --bad:#ef6a5c; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#141815; --surface:#1d221f; --line:#2f3732; --fg:#e8ebe6; --muted:#9aa49d;
  --accent:#f0773b; --accent-fg:#1a0d05; --chip:#e0b44c;
  --sq-light:#c9c4b2; --sq-dark:#476153; --sq-sel:#d9a63a; --sq-last:rgba(217,166,58,.5); --sq-check:#d94a3a;
  --good:#5cbf86; --bad:#ef6a5c; color-scheme:dark }
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));padding-block:20px 32px}
.wrap{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(28px,5vw,40px);letter-spacing:-.02em;margin:0;line-height:1}
h1 span{color:var(--accent)}
.tag{color:var(--muted);font-size:13px}
.main{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}
@media (max-width:860px){.main{grid-template-columns:minmax(0,1fr)}}
.boardcol{display:flex;flex-direction:column;gap:10px;min-width:0}
.player{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 12px;background:var(--surface);border:1px solid var(--line);border-radius:8px}
.player .who{display:flex;align-items:center;gap:8px;min-width:0}
.dot{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--pstroke);flex:none}
.dot.w{background:var(--pw)} .dot.b{background:var(--pb)}
.player .name{font-weight:600}
.caps{font-size:18px;color:var(--muted);letter-spacing:-2px;min-height:20px;overflow:hidden;white-space:nowrap}
.clock{font-family:var(--f-mono);font-weight:600;font-size:20px;font-variant-numeric:tabular-nums;padding:3px 10px;border-radius:6px;background:var(--bg);color:var(--muted)}
.clock.on{background:var(--fg);color:var(--bg)}
.clock.low.on{background:var(--bad);color:#fff}
.board{position:relative;width:100%;max-width:600px;aspect-ratio:1;display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);border-radius:6px;overflow:hidden;box-shadow:0 0 0 6px var(--surface),0 0 0 7px var(--line);margin:6px auto 6px 7px}
@media (max-width:860px){.board{margin:6px auto}}
.sq{position:relative;display:flex;align-items:center;justify-content:center;cursor:pointer;user-select:none;-webkit-user-select:none}
.sq.l{background:var(--sq-light)} .sq.d{background:var(--sq-dark)}
.sq.last::before{content:"";position:absolute;inset:0;background:var(--sq-last)}
.sq.sel::before{content:"";position:absolute;inset:0;background:var(--sq-sel);opacity:.75}
.sq.check::before{content:"";position:absolute;inset:0;background:radial-gradient(circle,var(--sq-check) 0%,transparent 72%)}
.sq .hint{position:absolute;width:30%;height:30%;border-radius:50%;background:rgba(20,25,22,.28);z-index:2}
.sq .hint.cap{width:88%;height:88%;background:transparent;border:4px solid rgba(20,25,22,.3)}
.sq:focus-visible{outline:3px solid var(--accent);outline-offset:-3px}
.pc{position:relative;z-index:1;font-size:clamp(26px,8.6vw,58px);line-height:1;pointer-events:none}
.pc.w{color:var(--pw);-webkit-text-stroke:1.4px var(--pstroke);text-shadow:0 2px 0 rgba(0,0,0,.18)}
.pc.b{color:var(--pb);text-shadow:0 1px 0 rgba(255,255,255,.15)}
.coord{position:absolute;font-family:var(--f-mono);font-size:10px;font-weight:600;z-index:1;pointer-events:none}
.coord.r{top:3px;left:4px} .coord.f{bottom:2px;right:4px}
.sq.l .coord{color:var(--sq-dark)} .sq.d .coord{color:var(--sq-light)}
.overlay{position:absolute;inset:0;background:rgba(15,18,16,.55);display:flex;align-items:center;justify-content:center;z-index:5;padding:16px}
.modal{background:var(--surface);color:var(--fg);border-radius:10px;padding:18px 20px;text-align:center;max-width:320px;display:flex;flex-direction:column;gap:12px;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.modal h3{font-family:var(--f-display);font-size:24px;margin:0}
.promo{display:flex;gap:8px;justify-content:center}
.promo button{font-size:40px;width:56px;height:56px;padding:0}
.side{display:flex;flex-direction:column;gap:14px;min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.panel h2{font-family:var(--f-display);font-size:16px;font-weight:800;margin:0;letter-spacing:.01em;display:flex;justify-content:space-between;align-items:baseline}
.panel h2 small{font-family:var(--f-body);font-weight:500;font-size:12px;color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button,select,input{font:inherit;font-size:14px}
button{border:1px solid var(--line);background:var(--bg);color:var(--fg);padding:7px 12px;border-radius:7px;cursor:pointer;font-weight:500}
button:hover:not(:disabled){border-color:var(--muted)}
button:disabled{opacity:.45;cursor:not-allowed}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:600}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
select,input{border:1px solid var(--line);background:var(--bg);color:var(--fg);padding:7px 9px;border-radius:7px}
input[type=number]{width:96px;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;border-radius:0;background:transparent}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.wallets{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.wallet{padding:8px 10px;border-radius:8px;background:var(--bg)}
.wallet .lbl{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.wallet .amt{font-family:var(--f-mono);font-weight:600;font-size:18px;font-variant-numeric:tabular-nums}
.coin{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--chip);margin-right:5px;vertical-align:1px}
.status{font-size:14px;padding:9px 11px;border-radius:8px;background:var(--bg);border-left:3px solid var(--chip)}
.status b{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.pot{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.pot b{color:var(--fg);font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.moves{font-family:var(--f-mono);font-size:13px;max-height:220px;overflow-y:auto;display:grid;grid-template-columns:34px 1fr 1fr;row-gap:2px;font-variant-numeric:tabular-nums}
.moves .n{color:var(--muted)}
.moves .cur{background:var(--sq-last);border-radius:3px;padding:0 3px;margin-left:-3px}
.empty{color:var(--muted);font-size:13px}
.msg{font-weight:600}
.msg.good{color:var(--good)} .msg.bad{color:var(--bad)}
.note{font-size:12px;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.sq::before{transition:background .15s}}
</style>

</head>
<body>
<div class="wrap">
  <header>
    <h1>Gambito<span>.</span></h1>
    <div class="tag">Prototipo · ajedrez con apuesta de fichas virtuales</div>
  </header>

  <div class="main">
    <div class="boardcol">
      <div class="player" id="pTop"></div>
      <div class="board" id="board" role="grid" aria-label="Tablero de ajedrez"></div>
      <div class="player" id="pBot"></div>
    </div>

    <aside class="side">
      <section class="panel">
        <h2>Partida <small id="turnLbl"></small></h2>
        <div class="row">
          <div class="seg" role="group" aria-label="Modo">
            <button id="mLocal" aria-pressed="true">2 jugadores</button>
            <button id="mBot" aria-pressed="false">Contra bot</button>
          </div>
          <select id="tc" aria-label="Control de tiempo">
            <option value="180">3 min</option>
            <option value="300">5 min</option>
            <option value="600" selected>10 min</option>
          </select>
        </div>
        <div class="row">
          <button id="newBtn" class="primary">Nueva partida</button>
          <button id="flipBtn">Girar</button>
          <button id="drawBtn">Ofrecer tablas</button>
          <button id="resignBtn">Rendirse</button>
        </div>
        <div id="gameMsg" class="msg" aria-live="polite"></div>
      </section>

      <section class="panel">
        <h2>Mesa de apuesta <small>comisión 5%</small></h2>
        <div class="wallets">
          <div class="wallet"><div class="lbl">Blancas</div><div class="amt"><span class="coin"></span><span id="balW">1000</span></div></div>
          <div class="wallet"><div class="lbl">Negras</div><div class="amt"><span class="coin"></span><span id="balB">1000</span></div></div>
        </div>
        <div id="betStatus" class="status" aria-live="polite"></div>
        <div id="betControls" class="row"></div>
        <div class="pot"><span>Bote</span><b id="potLbl">—</b></div>
        <div class="pot"><span>Paga al ganador</span><b id="payLbl">—</b></div>
      </section>

      <section class="panel">
        <h2>Jugadas <small id="moveCount"></small></h2>
        <div id="moves" class="moves"></div>
      </section>
      <p class="note">Las fichas son de práctica y no tienen valor. El bot es un motor sencillo de demostración; la versión real usaría Stockfish en el servidor.</p>
    </aside>
  </div>
</div>

<script>
(function(){
const GLYPH={k:'♚',q:'♛',r:'♜',b:'♝',n:'♞',p:'♟︎'};
const NAME={w:'Blancas',b:'Negras'};
const RAKE=0.05;
const $=id=>document.getElementById(id);

let game, mode='local', flipped=false, selected=null, lastMove=null, pendingPromo=null;
let clocks={w:600,b:600}, tick=null, lastTs=0, over=null;
let balances={w:1000,b:1000};
let bet; // {phase:'propose'|'respond'|'locked'|'none'|'settled', offer, by, amount}

function botColor(){return mode==='bot'?'b':null}
function isBotTurn(){return mode==='bot' && game.turn()===botColor() && !over}

/* ---------- Apuesta ---------- */
function resetBet(){bet={phase:'propose',offer:50,by:'w',amount:0};}
function canPlay(){return bet.phase==='locked'||bet.phase==='none'}
function other(c){return c==='w'?'b':'w'}

function makeOffer(by,amt){
  amt=Math.round(amt);
  const max=Math.min(balances.w,balances.b);
  if(!(amt>=10)) return say('La apuesta mínima es de 10 fichas.','bad');
  if(amt>max) return say('Ninguno puede apostar más de '+max+' fichas.','bad');
  bet.phase='respond'; bet.by=by; bet.offer=amt; say('');
  renderBet();
  if(mode==='bot' && other(by)==='b') setTimeout(botRespond,700);
}
function acceptOffer(){
  bet.amount=bet.offer; balances.w-=bet.amount; balances.b-=bet.amount;
  bet.phase='locked'; say('Apuesta cerrada. Juegan blancas.','good'); renderAll();
}
function declineOffer(){bet.phase='none';bet.amount=0;say('Partida sin apuesta. Juegan blancas.');renderAll();}
function botRespond(){
  const o=bet.offer;
  if(o<=150) return acceptOffer();
  const counter=Math.max(10,Math.round(o*0.6/10)*10);
  makeOffer('b',counter);
}
function settle(winner){
  if(bet.phase!=='locked') return;
  const pot=bet.amount*2;
  if(winner){const pay=Math.round(pot*(1-RAKE)); balances[winner]+=pay;}
  else {balances.w+=bet.amount;balances.b+=bet.amount;}
  bet.phase='settled';
}

function renderBet(){
  $('balW').textContent=balances.w; $('balB').textContent=balances.b;
  const st=$('betStatus'), ctl=$('betControls'); ctl.innerHTML='';
  const pot=bet.phase==='locked'||bet.phase==='settled'?bet.amount*2:(bet.phase==='respond'?bet.offer*2:0);
  $('potLbl').textContent=pot?pot+' fichas':'—';
  $('payLbl').textContent=pot?Math.round(pot*(1-RAKE))+' fichas':'—';
  const btn=(t,fn,cls)=>{const b=document.createElement('button');b.textContent=t;if(cls)b.className=cls;b.onclick=fn;ctl.appendChild(b);return b};
  const inp=(v)=>{const i=document.createElement('input');i.type='number';i.min=10;i.step=10;i.value=v;i.id='betAmt';i.setAttribute('aria-label','Fichas');ctl.appendChild(i);return i};

  if(bet.phase==='propose'){
    st.innerHTML='Blancas propone cuánto apostar.';
    const i=inp(bet.offer);
    btn('Proponer',()=>makeOffer('w',+i.value),'primary');
    btn('Jugar sin apuesta',declineOffer);
  } else if(bet.phase==='respond'){
    const resp=other(bet.by);
    if(mode==='bot' && resp==='b'){st.innerHTML='El bot está revisando tu oferta de <b>'+bet.offer+'</b>…';return;}
    st.innerHTML=NAME[bet.by]+' ofrece <b>'+bet.offer+'</b> fichas. Responde '+NAME[resp]+'.';
    btn('Igualar '+bet.offer,acceptOffer,'primary');
    const i=inp(bet.offer);
    btn('Contraoferta',()=>{
      const v=+i.value;
      if(v===bet.offer) return say('Para contraofertar cambia la cantidad, o iguala.','bad');
      makeOffer(resp,v);
    });
    btn('Rechazar',declineOffer);
  } else if(bet.phase==='locked'){
    st.innerHTML='En juego: <b>'+bet.amount+'</b> fichas por lado.';
  } else if(bet.phase==='none'){
    st.innerHTML='Partida amistosa, sin apuesta.';
  } else if(bet.phase==='settled'){
    st.innerHTML=over&&over.winner?'Ganan '+NAME[over.winner]+': cobran <b>'+Math.round(bet.amount*2*(1-RAKE))+'</b> fichas.':'Tablas: cada quien recupera <b>'+bet.amount+'</b>.';
  }
}

/* ---------- Tablero ---------- */
function sqName(r,f){return 'abcdefgh'[f]+(8-r)}
function kingSquare(color){
  const b=game.board();
  for(let r=0;r<8;r++)for(let f=0;f<8;f++){const p=b[r][f];if(p&&p.type==='k'&&p.color===color)return sqName(r,f)}
}
function renderBoard(){
  const el=$('board'); el.innerHTML='';
  const b=game.board();
  const targets={};
  if(selected) game.moves({square:selected,verbose:true}).forEach(m=>targets[m.to]=!!m.captured||m.flags.includes('e'));
  const chk=game.in_check()?kingSquare(game.turn()):null;
  for(let i=0;i<8;i++)for(let j=0;j<8;j++){
    const r=flipped?7-i:i, f=flipped?7-j:j, name=sqName(r,f);
    const d=document.createElement('div');
    d.className='sq '+((r+f)%2?'d':'l');
    if(lastMove&&(lastMove.from===name||lastMove.to===name)) d.classList.add('last');
    if(selected===name) d.classList.add('sel');
    if(chk===name) d.classList.add('check');
    d.tabIndex=0; d.setAttribute('role','gridcell'); d.dataset.sq=name;
    const p=b[r][f];
    d.setAttribute('aria-label',name+(p?' '+NAME[p.color]+' '+p.type:''));
    if(j===0){const c=document.createElement('span');c.className='coord r';c.textContent=8-r;d.appendChild(c)}
    if(i===7){const c=document.createElement('span');c.className='coord f';c.textContent='abcdefgh'[f];d.appendChild(c)}
    if(p){const s=document.createElement('span');s.className='pc '+p.color;s.textContent=GLYPH[p.type];d.appendChild(s)}
    if(name in targets){const h=document.createElement('span');h.className='hint'+(targets[name]?' cap':'');d.appendChild(h)}
    d.onclick=()=>clickSq(name);
    d.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();clickSq(name)}};
    el.appendChild(d);
  }
  if(pendingPromo) el.appendChild(promoOverlay());
  if(over) el.appendChild(endOverlay());
}
function promoOverlay(){
  const o=document.createElement('div');o.className='overlay';
  const m=document.createElement('div');m.className='modal';
  m.innerHTML='<h3>Coronar</h3>';
  const row=document.createElement('div');row.className='promo';
  ['q','r','b','n'].forEach(t=>{
    const b=document.createElement('button');
    b.innerHTML='<span class="pc '+game.turn()+'" style="font-size:38px">'+GLYPH[t]+'</span>';
    b.setAttribute('aria-label','Coronar '+t);
    b.onclick=()=>{const p=pendingPromo;pendingPromo=null;doMove(p.from,p.to,t)};
    row.appendChild(b);
  });
  m.appendChild(row);
  const c=document.createElement('button');c.textContent='Cancelar';c.onclick=()=>{pendingPromo=null;renderBoard()};
  m.appendChild(c);o.appendChild(m);return o;
}
function endOverlay(){
  const o=document.createElement('div');o.className='overlay';
  const m=document.createElement('div');m.className='modal';
  m.innerHTML='<h3>'+(over.winner?'Ganan '+NAME[over.winner]:'Tablas')+'</h3><div>'+over.reason+'</div>';
  const b=document.createElement('button');b.className='primary';b.textContent='Revancha';b.onclick=newGame;
  m.appendChild(b);o.appendChild(m);return o;
}

function clickSq(name){
  if(over||pendingPromo) return;
  if(!canPlay()) return say('Primero cierren la apuesta o elijan jugar sin apuesta.','bad');
  if(isBotTurn()) return;
  const p=game.get(name);
  if(selected){
    const mv=game.moves({square:selected,verbose:true}).find(m=>m.to===name);
    if(mv){
      if(mv.flags.includes('p')){pendingPromo={from:selected,to:name};selected=null;renderBoard();return}
      doMove(selected,name);return;
    }
  }
  selected=(p&&p.color===game.turn()&&selected!==name)?name:null;
  renderBoard();
}

function doMove(from,to,promotion){
  const m=game.move({from,to,promotion:promotion||'q'});
  if(!m) return;
  lastMove={from:m.from,to:m.to}; selected=null;
  if(!tick) startClock();
  checkEnd();
  renderAll();
  if(isBotTurn()) setTimeout(botMove,350);
}

/* ---------- Reloj ---------- */
function startClock(){lastTs=performance.now();tick=setInterval(()=>{
  const now=performance.now(),dt=(now-lastTs)/1000;lastTs=now;
  if(over) return stopClock();
  const t=game.turn(); clocks[t]=Math.max(0,clocks[t]-dt);
  if(clocks[t]<=0){finish(other(t),'Se acabó el tiempo de '+NAME[t]+'.');renderAll();return}
  renderPlayers();
},100)}
function stopClock(){clearInterval(tick);tick=null}
function fmt(s){s=Math.ceil(s);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}

/* ---------- Fin de partida ---------- */
function finish(winner,reason){over={winner,reason};stopClock();settle(winner);say(winner?'Ganan '+NAME[winner]+'.':'Tablas.',winner?'good':'')}
function checkEnd(){
  if(game.in_checkmate()) return finish(other(game.turn()),'Jaque mate.');
  if(game.in_stalemate()) return finish(null,'Rey ahogado.');
  if(game.in_threefold_repetition()) return finish(null,'Triple repetición.');
  if(game.insufficient_material()) return finish(null,'Material insuficiente.');
  if(game.in_draw()) return finish(null,'Regla de las 50 jugadas.');
}

/* ---------- Bot (demo: minimax con poda alfa-beta, 2 jugadas) ---------- */
const VAL={p:100,n:320,b:330,r:500,q:900,k:0};
function evaluate(){
  const b=game.board();let s=0;
  for(let r=0;r<8;r++)for(let f=0;f<8;f++){const p=b[r][f];if(!p)continue;
    const center=(3.5-Math.abs(3.5-r))+(3.5-Math.abs(3.5-f));
    let v=VAL[p.type]+(p.type!=='k'&&p.type!=='q'?center*4:0);
    if(p.type==='p') v+=(p.color==='w'?6-r:r-1)*6;
    s+=p.color==='w'?v:-v;}
  return s;
}
function negamax(depth,a,b,sign){
  if(depth===0) return sign*evaluate();
  const moves=game.moves({verbose:true});
  if(!moves.length) return game.in_check()?-99999-depth:0;
  moves.sort((x,y)=>(y.captured?VAL[y.captured]:0)-(x.captured?VAL[x.captured]:0));
  let best=-Infinity;
  for(const m of moves){game.move(m);const v=-negamax(depth-1,-b,-a,-sign);game.undo();
    if(v>best)best=v; if(v>a)a=v; if(a>=b)break;}
  return best;
}
function botMove(){
  if(!isBotTurn()) return;
  const sign=game.turn()==='w'?1:-1;
  let best=null,bv=-Infinity;
  for(const m of game.moves({verbose:true})){
    game.move(m);const v=-negamax(2,-Infinity,Infinity,-sign)+Math.random()*8;game.undo();
    if(v>bv){bv=v;best=m}
  }
  if(best) doMove(best.from,best.to,best.promotion);
}

/* ---------- UI general ---------- */
function say(t,cls){const e=$('gameMsg');e.textContent=t||'';e.className='msg'+(cls?' '+cls:'')}
function capturedBy(color){
  return game.history({verbose:true}).filter(m=>m.color===color&&m.captured).map(m=>m.captured)
    .sort((a,b)=>VAL[b]-VAL[a]).map(t=>GLYPH[t]).join('');
}
function playerHTML(c){
  const running=tick&&!over&&game.turn()===c;
  const nm=mode==='bot'&&c==='b'?'Bot Gambito':(mode==='bot'?'Tú':NAME[c]);
  return '<div class="who"><span class="dot '+c+'"></span><span class="name">'+nm+'</span><span class="caps">'+capturedBy(c)+'</span></div>'+
    '<span class="clock'+(running?' on':'')+(clocks[c]<30?' low':'')+'">'+fmt(clocks[c])+'</span>';
}
function renderPlayers(){
  const top=flipped?'w':'b',bot=flipped?'b':'w';
  $('pTop').innerHTML=playerHTML(top);$('pBot').innerHTML=playerHTML(bot);
}
function renderMoves(){
  const h=game.history(),el=$('moves');
  $('moveCount').textContent=h.length?Math.ceil(h.length/2)+' movimientos':'';
  if(!h.length){el.innerHTML='<span class="empty" style="grid-column:1/-1">Aún no hay jugadas.</span>';return}
  let s='';
  for(let i=0;i<h.length;i+=2){
    s+='<span class="n">'+(i/2+1)+'.</span><span'+(i===h.length-1?' class="cur"':'')+'>'+h[i]+'</span><span'+(i+1===h.length-1?' class="cur"':'')+'>'+(h[i+1]||'')+'</span>';
  }
  el.innerHTML=s;el.scrollTop=el.scrollHeight;
}
function renderAll(){
  renderBoard();renderPlayers();renderMoves();renderBet();
  $('turnLbl').textContent=over?'terminada':(canPlay()?'turno de '+NAME[game.turn()].toLowerCase():'esperando apuesta');
  $('drawBtn').disabled=$('resignBtn').disabled=!!over||!canPlay()||!game.history().length;
}

function newGame(){
  stopClock();
  game=new Chess(); selected=null; lastMove=null; pendingPromo=null; over=null;
  const t=+$('tc').value; clocks={w:t,b:t};
  if(balances.w<10||balances.b<10) balances={w:1000,b:1000};
  resetBet(); say(''); renderAll();
}

$('newBtn').onclick=newGame;
$('flipBtn').onclick=()=>{flipped=!flipped;renderAll()};
$('tc').onchange=()=>{if(!game.history().length){const t=+$('tc').value;clocks={w:t,b:t};renderPlayers()}};
$('resignBtn').onclick=()=>{
  if(over) return;
  const loser=mode==='bot'?'w':game.turn();
  finish(other(loser),NAME[loser]+' se rindió.');renderAll();
};
$('drawBtn').onclick=()=>{
  if(over) return;
  if(mode==='bot'){
    if(Math.abs(evaluate())<80){finish(null,'Tablas de común acuerdo.');}
    else say('El bot rechaza las tablas.','bad');
  } else finish(null,'Tablas de común acuerdo.');
  renderAll();
};
function setMode(m){
  mode=m;$('mLocal').setAttribute('aria-pressed',m==='local');$('mBot').setAttribute('aria-pressed',m==='bot');
  flipped=false;newGame();
}
$('mLocal').onclick=()=>setMode('local');
$('mBot').onclick=()=>setMode('bot');

newGame();
})();
</script>
